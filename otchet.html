<!DOCTYPE html>

    <style>
        body {
            font-family: Cascadia, sans-serif;
            line-height: 1.6;
            margin: 0;

        }
        .container {
            max-width: 1200px;

            margin: 20px 0;
            padding: 20px;
            text-align: center;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .screenshot-placeholder img {
            max-width: 100%;
            max-height: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 10px;
        }
